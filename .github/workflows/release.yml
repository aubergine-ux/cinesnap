name: Release

# Push a tag like v0.1.0 to build installers for every platform and attach
# them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            args: ""
            target: ""
          - os: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libpipewire-0.3-dev libclang-dev libdbus-1-dev libxcb1-dev libxcb-randr0-dev libx11-dev \
            libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config cmake

      # whisper.cpp's bindings are generated with libclang.
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Cinesnap __VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The standalone command-line renderer, attached to the same release. The
  # GitHub Action (action.yml) downloads these by name.
  cli:
    # After the installers, so the release for this tag already exists and
    # the two jobs never race to create it.
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the binary also runs on older glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: cinesnap-cli-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: cinesnap-cli-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: cinesnap-cli-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: cinesnap-cli-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # whisper.cpp is compiled in: cmake and a C++ compiler are on the
      # runners already, bindgen needs libclang.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev cmake

      # whisper.cpp's bindings are generated with libclang.
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p cinesnap-core --bin cinesnap-cli --target ${{ matrix.target }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Same tag the installers use: the pushed tag, or v<app version>
          # for a manual run.
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          fi

          exe=""
          case "$ASSET" in *.exe) exe=".exe" ;; esac
          mkdir -p upload
          cp "target/$TARGET/release/cinesnap-cli$exe" "upload/$ASSET"

          # The installer job normally created the (draft) release. If it did
          # not get that far, make one so the binaries still land somewhere.
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            if gh release create "$tag" --draft --title "Cinesnap ${tag#v}" \
              --notes "See the assets below to download and install this version." >/dev/null 2>&1; then break; fi
            sleep $((attempt * 5))
          done

          for attempt in 1 2 3 4 5; do
            if gh release upload "$tag" "upload/$ASSET" --clobber; then exit 0; fi
            echo "upload failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not attach $ASSET to release $tag"
          exit 1
