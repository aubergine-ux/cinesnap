[package]
name = "cinesnap"
description = "Screen recorder that turns raw recordings into polished demo videos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cinesnap-core = { path = "../crates/cinesnap-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
device_query = "4"
xcap = "0.9"
ffmpeg-sidecar = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
evdev = "0.13"
