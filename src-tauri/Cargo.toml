[package]
name = "cinesnap"
description = "Screen recorder that turns raw recordings into polished demo videos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cinesnap-core = { path = "../crates/cinesnap-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
device_query = "4"
xcap = "0.9"
ffmpeg-sidecar = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast", "global_shortcuts"] }
futures-util = "0.3"
pipewire = "0.10"
evdev = "0.13"
pollster = "0.4"
